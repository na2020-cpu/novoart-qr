<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVOART | Generador QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body {
  font-family: Arial, sans-serif;
  max-width: 650px;
  margin: 25px auto;
  padding: 20px;
  background: #f4f4f4;
  color: #222;
}
h1 { text-align: center; }
.logo { text-align: center; letter-spacing: 4px; }
.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 18px;
}
input, textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 11px;
  margin: 7px 0 14px;
  border: 1px solid #ccc;
  border-radius: 6px;
}
button {
  padding: 12px;
  width: 100%;
  margin: 5px 0;
  border: 0;
  border-radius: 6px;
  background: #222;
  color: white;
  cursor: pointer;
}
img { max-width: 100%; }
#qr { display: flex; justify-content: center; margin: 20px; }
label { font-weight: bold; }
</style>
</head>
<body>

<div class="logo"><h1>NOVOART</h1>
<p>25 años nos respaldan</p></div>

<div id="ficha" class="card" hidden>
  <h2 id="nombrePublico"></h2>
  <img id="fotoPublica" alt="Fotografía del mueble" hidden>
  <p><b>Clave:</b> <span id="clavePublica"></span></p>
  <p><b>Descripción:</b> <span id="descripcionPublica"></span></p>
  <p><b>Medidas:</b> <span id="medidasPublicas"></span></p>
  <p><b>Precio:</b> <span id="precioPublico"></span></p>
</div>

<div id="generador" class="card">
  <h2>Generador de QR</h2>

  <label>Nombre del mueble</label>
  <input id="nombre" placeholder="Ej. Credenza de cedro">

  <label>Clave del artículo</label>
  <input id="clave" placeholder="Ej. NOV-001">

  <label>Descripción</label>
  <textarea id="descripcion" placeholder="Descripción del mueble"></textarea>

  <label>Medidas</label>
  <input id="medidas" placeholder="Ej. 180 x 45 x 80 cm">

  <label>Precio</label>
  <input id="precio" placeholder="Ej. $13,999 MXN">

  <label>URL pública de la fotografía</label>
  <input id="foto" type="url" placeholder="https://...">

  <button onclick="generarQR()">GENERAR QR</button>

  <div id="resultado" hidden>
    <h3 style="text-align:center">QR DEL ARTÍCULO</h3>
    <div id="qr"></div>
    <button onclick="descargarQR()">DESCARGAR QR</button>
    <button onclick="abrirFicha()">VER FICHA PÚBLICA</button>
  </div>
  <p id="mensaje"></p>
</div>

<script>
const parametros = new URLSearchParams(window.location.search);
const esFicha = parametros.has("clave") || parametros.has("nombre");

if (esFicha) {
  document.getElementById("generador").hidden = true;
  document.getElementById("ficha").hidden = false;

  document.getElementById("nombrePublico").textContent =
    parametros.get("nombre") || "Artículo NOVOART";
  document.getElementById("clavePublica").textContent =
    parametros.get("clave") || "";
  document.getElementById("descripcionPublica").textContent =
    parametros.get("descripcion") || "";
  document.getElementById("medidasPublicas").textContent =
    parametros.get("medidas") || "";
  document.getElementById("precioPublico").textContent =
    parametros.get("precio") || "";

  const foto = parametros.get("foto");
  if (foto) {
    try {
      const url = new URL(foto);
      if (url.protocol === "https:" || url.protocol === "http:") {
        const imagen = document.getElementById("fotoPublica");
        imagen.src = url.href;
        imagen.hidden = false;
      }
    } catch (e) {}
  }
}

let enlaceFicha = "";

function generarQR() {
  const nombre = document.getElementById("nombre").value.trim();
  const clave = document.getElementById("clave").value.trim();
  const descripcion = document.getElementById("descripcion").value.trim();
  const medidas = document.getElementById("medidas").value.trim();
  const precio = document.getElementById("precio").value.trim();
  const foto = document.getElementById("foto").value.trim();

  if (!nombre || !clave) {
    document.getElementById("mensaje").textContent =
      "Escribe al menos el nombre y la clave del artículo.";
    return;
  }

  if (!window.location.protocol.startsWith("http")) {
    document.getElementById("mensaje").textContent =
      "Primero publica este archivo en GitHub Pages y abre su enlace web.";
    return;
  }

  const base = window.location.href.split("?")[0].split("#")[0];
  const datos = new URLSearchParams({
    nombre, clave, descripcion, medidas, precio
  });
  if (foto) datos.set("foto", foto);

  enlaceFicha = base + "?" + datos.toString();

  document.getElementById("qr").innerHTML = "";
  document.getElementById("resultado").hidden = false;
  document.getElementById("mensaje").textContent = "";

  new QRCode(document.getElementById("qr"), {
    text: enlaceFicha,
    width: 280,
    height: 280,
    correctLevel: QRCode.CorrectLevel.M
  });
}

function descargarQR() {
  const lienzo = document.querySelector("#qr canvas");
  const imagen = document.querySelector("#qr img");
  const url = lienzo ? lienzo.toDataURL("image/png") :
              imagen ? imagen.src : "";

  if (!url) return;

  const enlace = document.createElement("a");
  enlace.href = url;
  enlace.download = "QR_NOVOART.png";
  enlace.click();
}

function abrirFicha() {
  if (enlaceFicha) window.open(enlaceFicha, "_blank");
}
</script>
</body>
</html>
